# Identidades aritméticas del formulario. El programa las usa para comprobar que
# lo que trajo del SII cuadra; si una falla, avisa en vez de callarlo.
#
# Fuente: anverso del F29 e instrucciones de las líneas 23, 49, 50, 80, 134 y 141.
identidades:
  - nombre: "Total débitos"
    total: "538"
    suma_lineas: [7, 22]        # "valor que resulte de la operación aritmética de los montos de la línea 7 a 22"
  - nombre: "Total créditos"
    total: "537"
    suma_lineas: [28, 48]       # "...de los montos de la línea 28 a 48"
  - nombre: "IVA determinado"
    total: "89"
    formula: ["538", "-", "537"]
    solo_si_positivo: true      # si da negativo va al código 77, no al 89
  - nombre: "Remanente para el período siguiente"
    total: "77"
    formula: ["537", "-", "538"]
    solo_si_positivo: true
  - nombre: "Total a pagar con recargo"
    total: "94"
    formula: ["91", "+", "92", "+", "93"]
    solo_si_presente: true      # sólo aplica a declaraciones fuera de plazo

# Secciones por rango de línea, para agrupar al mostrar el catálogo.
secciones:
  - {desde: 1, hasta: 6, nombre: "Ventas que no generan débito"}
  - {desde: 7, hasta: 23, nombre: "Débitos"}
  - {desde: 24, hasta: 27, nombre: "Compras sin derecho a crédito (informativo)"}
  - {desde: 28, hasta: 49, nombre: "Créditos"}
  - {desde: 50, hasta: 58, nombre: "Determinación del IVA"}
  - {desde: 59, hasta: 79, nombre: "Retenciones y PPM"}
  - {desde: 80, hasta: 80, nombre: "Subtotal del anverso"}
  - {desde: 81, hasta: 133, nombre: "Impuestos adicionales, cambio de sujeto y créditos especiales"}
  - {desde: 134, hasta: 200, nombre: "Resultado del ejercicio"}
