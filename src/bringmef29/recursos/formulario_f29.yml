# Estructura del Formulario 29: secciones, líneas y códigos.
#
# Transcrita del borrador que entrega el portal del SII
# (www4.sii.cl/rfiInternet — vista PPTA-F29-VER), que es la numeración de líneas
# vigente. El catálogo de glosas y efectos por código está en codigos_f29.yml,
# generado desde las instrucciones oficiales.
#
# Por cada línea:
#   n          número de línea del formulario
#   glosa      el texto del formulario
#   cantidad   código de la columna "Cantidad de documentos", si la línea tiene
#   codigo     código de la columna del monto
#   signo      "+" suma, "-" resta, "=" total del bloque, "" no entra en totales
#   extra      otros códigos de la línea (bases, tasas, créditos), como
#              [{etiqueta, codigo}] — se muestran en el formulario completo
#
# Las secciones se dibujan como tablas separadas, con su título encima.

secciones:

  # ===================== DÉBITOS Y VENTAS =====================
  - titulo: "DÉBITOS Y VENTAS"
    subtitulo: "Ventas y/o servicios prestados · Información de ingresos"
    columnas: ["Cantidad de documentos", "Monto neto"]
