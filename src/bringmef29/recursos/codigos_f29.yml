# Catálogo de códigos del Formulario 29.
#
# Sólo se usa para poner glosas legibles en el aviso de pago: el programa nunca
# depende de este archivo para calcular montos. Está pensado para que lo edites
# y lo completes con los códigos que tus clientes efectivamente usan; el SII
# publica el detalle oficial en el instructivo vigente del F29.
#
# Formato:  "<código>": glosa

glosas:
  # --- Débitos / ventas ---
  "502": "IVA débito fiscal de facturas emitidas"
  "503": "Cantidad de facturas emitidas"
  "509": "Cantidad de notas de crédito emitidas"
  "510": "IVA de notas de crédito emitidas"
  "142": "Ventas y/o servicios exentos o no gravados"
  "563": "Base imponible (ventas netas del período)"

  # --- Créditos / compras ---
  "504": "Remanente de crédito fiscal del mes anterior"
  "511": "IVA crédito fiscal de facturas recibidas"
  "519": "Cantidad de facturas recibidas"
  "520": "IVA crédito fiscal de facturas recibidas (activo fijo)"

  # --- Totales de IVA ---
  "537": "Total créditos"
  "538": "Total débitos"
  "077": "Remanente de crédito fiscal para el período siguiente"
  "089": "Impuesto determinado (anverso)"
  "595": "Subtotal impuesto determinado (anverso)"

  # --- Otros impuestos y pagos provisionales ---
  "062": "PPM neto determinado"
  "048": "Retención de impuesto único a los trabajadores"
  "151": "Retención sobre honorarios (art. 42 N°2)"

  # --- Resultado de la declaración ---
  "547": "Total determinado"
  "091": "Total a pagar dentro del plazo legal"
  "092": "Reajuste por pago fuera de plazo"
  "093": "Multas e intereses"
  "094": "Total a pagar con recargo"

# Códigos que aparecen en el resumen del aviso de pago, en este orden.
# Los que no vengan en la declaración simplemente se omiten.
destacados:
  - "563"
  - "538"
  - "537"
  - "077"
  - "062"
  - "048"
  - "151"
  - "547"
  - "092"
  - "093"

# Códigos que determinan el monto a pagar, en orden de prioridad.
# El primero con valor mayor que cero es el que se le cobra al contribuyente.
codigos_monto_a_pagar:
  - "094"
  - "091"
  - "547"
