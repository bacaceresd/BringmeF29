      - {n: 18, glosa: "Liquidación y Liquidación Factura emitidas (resta débito; ventas por cuenta de terceros)", cantidad: "817", codigo: "818", signo: "-"}
      - {n: 19, glosa: "Adicionales al débito fiscal del mes por devoluciones excesivas de otros períodos (Art. 27 bis)", codigo: "154", signo: "+"}
